<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Vis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js"
        integrity="sha384-MqL7Cy3itNqCI1Wlc926K0XhyRKJ/NMqTaytIIEB+QIdInOploxqRIHRKLlhPykM" crossorigin="anonymous"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<h1 id="title">Daily temperatures</h1>
<div class="sub" id="subtitle"></div>

<div class="controls">
  <div class="field cities-field"><span>Cities (up to 3)</span>
    <div class="cities">
      <span class="cities" id="chips"></span>
      <div class="search">
        <input id="loc" autocomplete="off" placeholder="Add a city…">
        <ul class="results" id="results"></ul>
      </div>
    </div>
  </div>
  <label class="field"><span>Month</span><select id="month"></select></label>
  <label class="field"><span>Year</span><input id="year" type="number" min="1941"></label>
  <div class="field"><span>&nbsp;</span>
    <div class="seg"><button id="prev" title="Previous month (←)">‹ Prev</button><button id="next" title="Next month (→)">Next ›</button></div>
  </div>
  <label class="field"><span>Baseline from</span><input id="bstart" type="number" min="1941" value="2000"></label>
  <label class="field"><span>to</span><input id="bend" type="number" min="1941" value="2020"></label>
  <div class="field"><span>View</span>
    <div class="seg" id="mode"><button data-v="smoothed" class="on">7-day mean</button><button data-v="daily">Daily</button></div>
  </div>
  <div class="field"><span>Units</span>
    <div class="seg" id="units"><button data-v="F" class="on">°F</button><button data-v="C">°C</button></div>
  </div>
  <div class="field"><span>&nbsp;</span><button class="link" id="reset" title="Back to Cambridge, MA, this month, all series">Reset</button></div>
</div>

<div id="status" class="status">Loading…</div>
<div class="main">
  <div id="chart"></div>
  <aside class="legend" id="legend"></aside>
</div>
<p class="note">
  Data: <a href="https://open-meteo.com/">Open-Meteo</a> historical weather (ERA5 reanalysis, a ~9–25 km modelled grid)
  and forecast. Values are grid-cell estimates, not station readings, and can differ from official
  airport records by 1–3°F.
</p>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
