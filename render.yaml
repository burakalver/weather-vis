# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: weather-vis
    runtime: docker
    # free: $0, sleeps after ~15 min idle (next visit takes ~30-60s). 0.5c-512mb: $7/mo, always on.
    # Both work on the free Hobby workspace; the $25/mo Pro workspace is not needed.
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass  # deploy only after GitHub Actions CI passes
