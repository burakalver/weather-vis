[project]
name = "weather-vis"
version = "0.1.0"
description = "Compare a month's daily temperatures against a multi-year baseline (Open-Meteo)"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "real_api: hits the real Open-Meteo API -- run manually with `-m real_api`, never in CI",
]
addopts = "-m 'not real_api'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, pyupgrade, bugbear
select = ["F", "E", "W", "I", "UP", "B"]
